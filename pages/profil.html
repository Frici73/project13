<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/profil.css">
    <title>Working Souls - Profil</title>
</head>

<body>
    <script src="../js/basic.js"></script>
    <table>
        <tr>
            <td></td>
            <td>Adatok</td>
            <td>Publikus</td>
        </tr>
        <tr>
            <td>E-mail-cím</td>
            <td><input type="email"></td>
            <td class="check-cell"><input type="checkbox"><span>&#10006;</span></td>
        </tr>
        <tr>
            <td>Telefonszám</td>
            <td><input type="number"></td>
            <td class="check-cell"><input type="checkbox"><span>&#10006;</span></td>
        </tr>
        <tr>
            <td>Felhasználónév</td>
            <td><input type="text"></input></td>
            <td class="check-cell"><input type="checkbox"><span>&#10006;</span></td>
        </tr>
        <tr>
            <td>Jelszó</td>
            <td colspan="2"><input type="password"></td>
        </tr>
        <tr>
            <td>Profilkép</td>
            <td><input type="file" id="profileImage"><span id="fileSelector">Nincs fájl kiválasztva</span></td>
            <td class="check-cell"><input type="checkbox"><span>&#10006;</span></td>
        </tr>
    </table>
    <script src="../js/profil.js"></script>
</body>

</html>
